name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CI only reads the repo; the checkout token never needs more (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The examples smoke test and root typecheck reach into examples/src,
      # whose UI dependencies (MUI) live in the examples package.
      - name: Install example dependencies
        run: npm ci
        working-directory: examples

      # The smoke test resolves the deduped UI packages from the ROOT
      # lockfile while the deployed playground builds from the examples one;
      # fail loudly if a one-sided bump makes CI certify a different build
      # than the one that ships.
      - name: Check lockfiles agree on deduped packages
        run: node scripts/check-lockfile-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      # The core and the hooks compile with lib ES2022 only, against a
      # declaration of exactly the host globals they use (console, timers,
      # an optional process.env, an optional localStorage). This is what
      # the docs' React Native statement rests on: a DOM API creeping into
      # the core fails here, not in a user's Hermes bundle.
      - name: Typecheck without the DOM lib
        run: npm run typecheck:nodom

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build docs
        run: npm run docs:build

      # VitePress fails the build on a dead .md link inside docs/, but it
      # never checks anchors and never looks at the READMEs — so a reworded
      # heading, or a README link left behind by a page move, rots silently.
      # Anchors are matched against the ids the build just rendered.
      - name: Check doc links and anchors
        run: node scripts/check-doc-links.mjs

      # The docs deploy builds the examples app with the examples' own
      # toolchain — run the same build here so dependency PRs against
      # examples/ get judged on it BEFORE they can break the deploy.
      - name: Build examples
        run: npm run build
        working-directory: examples

      # The built bundle must hold exactly one React copy — the formstand
      # alias reaches outside the examples package, and a second resolved
      # React crashes the deployed playground at startup. Only the artifact
      # shows this; jsdom tests can't.
      - name: Check the bundle holds a single React
        run: node scripts/check-single-react.mjs

      # Gzip budgets over the library's three entries and the playground's
      # main chunk and stylesheet, a few percent above measured: the
      # lazy-chunk work cut the main bundle from 2.95 MB to 381 kB with
      # nothing guarding it, and no test can see a bundle regrow. Runs here,
      # after both builds, because it reads both artifact sets.
      - name: Check bundle sizes against their budgets
        run: node scripts/check-bundle-size.mjs

      # The starter template installs the PUBLISHED formstand and
      # formstand-cli and builds: a user's first `npm run dev` is this step.
      # The suite renders the template against the source separately
      # (tests/template.vite-react.test.tsx), which covers the next release.
      - name: Build the starter template against the published packages
        run: npm install --no-audit --no-fund && npm run build
        working-directory: templates/vite-react

      # The Next.js example (a server action re-parsing with the schema)
      # installs the PUBLISHED formstand and runs `next build`: the SSR
      # guide's rules, checked by the framework that enforces them. The
      # suite renders its client form and runs its action in-process
      # against the source (tests/examples.next.test.tsx).
      - name: Build the Next.js example against the published packages
        run: npm install --no-audit --no-fund && npm run build
        working-directory: examples/next

      # Real-browser e2e over the BUILT bundle — the deployed-artifact class
      # of bug (dual React, blank renders, broken mobile shell) that jsdom
      # can't see. Screenshots upload for eyeballing either way.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: examples

      - name: Playground e2e (built bundle, real Chromium)
        run: node e2e/playground.e2e.mjs
        working-directory: examples

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-screenshots
          path: examples/e2e/artifacts/
          if-no-files-found: ignore

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: CLI typecheck, test, build
        run: npm run typecheck && npm test && npm run build
        working-directory: cli

      # The "Generated" playground tab must be exactly what the current CLI
      # emits — regenerate and fail on drift, so the demo can't quietly go
      # stale as the emitters evolve.
      - name: Verify generated demos match the CLI's output
        run: node scripts/generate-cli-demos.mjs && git diff --exit-code examples/src/generated
